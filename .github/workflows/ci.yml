name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [pipeline, api]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # exit code 5 = no tests collected yet (only until the first tests land)
      - run: python -m unittest discover -s tests -v || [ $? -eq 5 ]
