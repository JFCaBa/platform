# Platform (whatplatform.uk) — installed as /etc/nginx/sites-enabled/whatplatform.uk.conf
# Privacy: no access logs on disk. What Platform's API requests go over local UDP (syslog) to
# the stats receiver in the API container, which keeps only aggregates: the IP and User-Agent
# are combined for an instant with a daily random key to count people once a day, then dropped
# (api/platform_api/stats.py). Andén's locations and everything else are not sent; Andén counts
# its own board in its API (/anden/live/ passes the IP for that).

# Last field "E" marks the end: a truncated datagram lacks it and is dropped.
log_format platform_stats '$msec|$request_method|$uri|$status|$upstream_cache_status|$remote_addr|$http_user_agent|E';

proxy_cache_path /var/cache/nginx/platform levels=1:2 keys_zone=platform:10m max_size=50m inactive=10m use_temp_path=off;

# /follow: stations share IPs (Wi-Fi, CGNAT), so the rate is generous per address.
limit_req_zone $binary_remote_addr zone=follow:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=anden_train:1m rate=10r/m;
# Every app on the board polls its station every 30 s; generous because mobile carriers put many
# phones behind one address (CGNAT).
limit_req_zone $binary_remote_addr zone=anden_live:1m rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name whatplatform.uk www.whatplatform.uk api.whatplatform.uk;
    access_log off;
    error_log /dev/null crit;  # error lines would carry client addresses

    root /var/www/certbot;
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API: https://api.whatplatform.uk/departures/{CRS}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.whatplatform.uk;
    access_log off;
    error_log /dev/null crit;  # error lines would carry client addresses
    include snippets/block-bad-bots.conf;

    ssl_certificate /etc/letsencrypt/live/whatplatform.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatplatform.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Only /departures/ABC reaches the API, rebuilt from the captured code: the cache key is
    # the code itself, so no other spelling of the URL can poison a station's entry.
    location ~ "^/departures/([A-Z]{3})$" {
        limit_except GET { deny all; }
        access_log syslog:server=127.0.0.1:8511,nohostname,tag=platform,severity=info platform_stats;
        set $crs $1;
        proxy_pass http://127.0.0.1:8510/departures/$crs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # The API never sees the client address.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";

        proxy_cache platform;
        proxy_cache_key $crs;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10m;
        proxy_cache_valid 502 504 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # The request that finds an expired entry waits for the fresh board; only requests
        # arriving meanwhile, or while the API is failing, get the stale one (old generatedAt).
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        # add_header here stops inheritance from the server block: repeat them.
        add_header X-Cache $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "https://whatplatform.uk" always;  # the website (site/)
    }

    # Later trains: /departures/ABC/OFFSET, OFFSET 1..119 min (Darwin's timeOffset range). Same
    # rules; key = code + offset. The app asks for multiples of 15 (plus 119), so a station's
    # users share a few entries. Pages are snapshots of trains 2-4 h ahead: kept 60 s.
    location ~ "^/departures/([A-Z]{3})/([1-9][0-9]?|1[01][0-9])$" {
        limit_except GET { deny all; }
        access_log syslog:server=127.0.0.1:8511,nohostname,tag=platform,severity=info platform_stats;
        set $crs $1;
        set $off $2;
        proxy_pass http://127.0.0.1:8510/departures/$crs/$off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";

        proxy_cache platform;
        proxy_cache_key "$crs:$off";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10m;
        proxy_cache_valid 502 504 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        # 150 rows are ~80 KB of JSON.
        gzip on;
        gzip_types application/json;
        add_header X-Cache $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "https://whatplatform.uk" always;  # the website (site/)
    }

    location /departures/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://whatplatform.uk" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 400 '{"error":"bad crs"}';
    }

    # A train's remaining stops (Darwin Service Details), same rules: id rebuilt from the capture.
    location ~ "^/service/([A-Za-z0-9_-]{6,40})$" {
        limit_except GET { deny all; }
        access_log syslog:server=127.0.0.1:8511,nohostname,tag=platform,severity=info platform_stats;
        set $sid $1;
        proxy_pass http://127.0.0.1:8510/service/$sid;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";

        proxy_cache platform;
        proxy_cache_key "service:$sid";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 1m;
        proxy_cache_valid 429 10s;
        proxy_cache_valid 502 503 504 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        add_header X-Cache $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "https://whatplatform.uk" always;  # the website (site/)
    }

    location /service/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://whatplatform.uk" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 400 '{"error":"bad service id"}';
    }

    # iPhone push following (POST registers, DELETE stops): small JSON body, never cached.
    location = /follow {
        limit_except POST DELETE { deny all; }
        access_log syslog:server=127.0.0.1:8511,nohostname,tag=platform,severity=info platform_stats;
        limit_req zone=follow burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8510/follow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";

        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;  # POST may wait 5 s for a slot + 8 s for Darwin
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8510;
    }

    # GB station list, rebuilt monthly on this server (deploy/stations/refresh.sh). Static: nginx
    # gives the ETag the app revalidates with. Not sent to the stats receiver.
    location = /stations.json {
        limit_except GET { deny all; }
        access_log off;
        root /opt/platform/stations;
        default_type application/json;
        gzip on;
        gzip_types application/json;
        add_header Cache-Control "public, max-age=86400";  # not on errors: a 404 is not kept
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "https://whatplatform.uk" always;  # the website (site/)
    }

    # Usage stats page. Password in platform-admin.htpasswd; the API also wants the secret header
    # from platform-admin-key.conf (`proxy_set_header X-Admin-Key "...";`, same as ADMIN_KEY in
    # /opt/platform/.env). Both files live outside the repo (deploy/README.md, "Stats").
    location = /admin {
        limit_except GET { deny all; }
        auth_basic "What Platform stats";
        auth_basic_user_file /etc/nginx/platform-admin.htpasswd;
        proxy_pass http://127.0.0.1:8510;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        include /etc/nginx/platform-admin-key.conf;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Andén (Spanish Cercanías app, repo JFCaBa/tren): iPhone push following, its own container.
    location = /anden/follow {
        limit_except POST DELETE { deny all; }
        limit_req zone=follow burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;  # the train's stops travel with it
        proxy_pass http://127.0.0.1:8520/follow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # One train's live reading (Android's follow service and the home screen poll it).
    location ~ "^/anden/train/([0-9A-Za-z_-]{3,40})/([0-9A-Za-z_-]{3,12})$" {
        limit_except GET { deny all; }
        limit_req zone=anden_train burst=5 nodelay;  # one follow polls every 30 s
        limit_req_status 429;
        set $trip $1;
        set $stop $2;
        proxy_pass http://127.0.0.1:8520/train/$trip/$stop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 25s;  # may wait for both Renfe feeds
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Andén board: one station's delays and live platforms (instead of Renfe's whole feeds).
    location ~ "^/anden/live/([0-9A-Za-z_-]{3,12})$" {
        limit_except GET { deny all; }
        access_log off;
        limit_req zone=anden_live burst=100 nodelay;
        limit_req_status 429;
        set $stop $1;
        proxy_pass http://127.0.0.1:8520/live/$stop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The only Andén route that gets the client IP: it counts people once a day for /anden/admin
        # (HMAC with a daily in-memory key, never stored; tren repo server/anden_api/stats.py).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;  # answers from memory
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Andén timetables, built nightly on this host (tren repo, pipeline/vps/feed.sh). Only these
    # files; anything else under /anden/data/ is a 404. Not logged, not counted anywhere.
    location ~ "^/anden/data/((?:feeds/[0-9A-Za-z_/-]+|index|feed)\.json)$" {
        limit_except GET { deny all; }
        access_log off;
        alias /opt/anden/data/current/$1;
        default_type application/json;
        gzip on;
        gzip_types application/json;
        add_header Cache-Control "public, max-age=600";  # as GitHub Pages; not on errors
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /anden/data/ {
        access_log off;
        return 404;
    }

    # Andén usage stats. Same password as /admin (platform-admin.htpasswd); the API also wants
    # the secret header from anden-admin-key.conf (`proxy_set_header X-Admin-Key "...";`, same
    # as ANDEN_ADMIN_KEY in /opt/anden/.env). Both live outside the repo (tren server/README.md).
    location = /anden/admin {
        limit_except GET { deny all; }
        auth_basic "Andén";
        auth_basic_user_file /etc/nginx/platform-admin.htpasswd;
        proxy_pass http://127.0.0.1:8520/admin$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        include /etc/nginx/anden-admin-key.conf;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /anden/health {
        proxy_pass http://127.0.0.1:8520/health;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.whatplatform.uk;
    access_log off;
    error_log /dev/null crit;  # error lines would carry client addresses

    ssl_certificate /etc/letsencrypt/live/whatplatform.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatplatform.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://whatplatform.uk$request_uri;
}

# Website: the board (site/index.html + site/js) and the privacy policy, from the repo checkout
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name whatplatform.uk;
    access_log off;
    error_log /dev/null crit;  # error lines would carry client addresses
    include snippets/block-bad-bots.conf;
    include snippets/honeypot.conf;

    ssl_certificate /etc/letsencrypt/live/whatplatform.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatplatform.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://api.whatplatform.uk; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Pages (index.html, privacy.html) revalidate on every load (ETag): a deploy shows at once.
    # Locations with their own add_header (below) set theirs.
    add_header Cache-Control "no-cache";

    root /opt/platform/repo/site;
    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # The page shell for home and station pages; the JS reads the URL (site/js/route.js).
    location = / { try_files /index.html =404; }
    location ~ "^/station/[A-Za-z]{3}/?$" { try_files /index.html =404; }
    location ~ ^/privacy/?$ { try_files /privacy.html =404; }

    # Scripts and styles: revalidated on every load (ETag), so a deploy shows at once. An
    # add_header here stops inheritance from the server block: repeat them.
    location ~ "^/(style\.css|js/[a-z]+\.js)$" {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://api.whatplatform.uk; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }
    # Images, shown through <img> only. Apple's badge styles its paths inline (style="fill:…"),
    # which the page CSP would block in browsers that apply an image's own CSP: none here.
    location ~ "^/(app-store-badge\.svg|favicon\.png|apple-touch-icon\.png)$" {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else in site/ (tests, package.json) is not public.
    location / { return 404; }
}
