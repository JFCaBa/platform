services:
  platform-api:
    build: .
    image: platform-api
    env_file: /opt/platform/.env
    ports:
      - "127.0.0.1:${PORT:-8510}:8510"
      - "127.0.0.1:8511:8511/udp"  # nginx's stats lines (syslog), fixed like the receiver
    volumes:
      - /opt/platform/stats:/data  # stats.db + backups/, aggregates only
      - /opt/platform/stations:/stations:ro  # stations.json from deploy/stations/refresh.sh
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
